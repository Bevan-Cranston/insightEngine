<!DOCTYPE html>
<html>
<head>
    <title>Insight Engine</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html {
            font-size: 16px;
        }

        body {
            font-size: 1rem;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.4;
        }

        .message-block,
        #current-chat {
            font-size: 1rem;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-width: 100%;
        }

        button {
            font-size: 1rem;
            margin-top: 10px;
            padding: 10px 16px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            font-size: 1rem;
        }

        #status {
            margin-top: 10px;
            margin-bottom: 10px;
            min-height: 1.5rem;
        }

    </style>
</head>

<body onload="loadConversations()">

    <h1>Insight Engine</h1>

    <h2>Conversations</h2>
    <button onclick="createNewConversation()">New Chat</button>
    <div id="conversation-list"></div>

    <button
        onclick="deleteAllConversations()"
        style="margin-top: 15px;">
        Delete All Conversations
    </button>

    <h2>Current Chat</h2>
    <div id="current-chat">No chat selected</div>

    <h2>Messages</h2>
    <div id="messages"></div>

    <textarea id="message" rows="8"
        placeholder="What are you reflecting on?"></textarea>
    <br>

    <button onclick="sendMessage()">Send</button>

    <div id="status"></div>

    <script>
        let currentConversationId = null;

        async function sendMessage() {
            const message = document.getElementById("message").value;
            const statusDiv = document.getElementById("status");

            statusDiv.innerText = "Thinking...";

            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    conversation_id: currentConversationId
                })
            });

            const data = await response.json();

            currentConversationId = data.conversation_id;

            await loadConversations();
            await loadMessages(currentConversationId);

            document.getElementById("message").value = "";
            statusDiv.innerText = "";
        }

        async function createNewConversation() {
            const response = await fetch("/conversations", {
                method: "POST"
            });

            const data = await response.json();
            currentConversationId = data.conversation_id;

            await loadConversations();
            document.getElementById("current-chat").innerText =
                data.conversation_title;
            document.getElementById("message").value = "";
        }

        async function loadConversations() {
            const response = await fetch("/conversations");
            const conversations = await response.json();

            const list = document.getElementById("conversation-list");
            list.innerHTML = "";

            conversations.forEach(convo => {
                const button = document.createElement("button");
                button.innerText = convo.title;

                button.onclick = async () => {
                    currentConversationId = convo.id;
                    document.getElementById("current-chat").innerText = convo.title;
                    document.getElementById("message").value = "";

                    await loadMessages(convo.id);
                };

                list.appendChild(button);
                list.appendChild(document.createElement("br"));
            });
        }

        async function loadMessages(conversationId) {
            const response = await fetch(
                `/conversations/${conversationId}/messages`
            );

            const messages = await response.json();
            const messagesDiv = document.getElementById("messages");

            messagesDiv.innerHTML = "";

            if (messages.length === 0) {
                messagesDiv.innerText = "No messages yet.";
                return;
            }

            messages.forEach(msg => {
                const messageBlock = document.createElement("div");
                messageBlock.className = "message-block";
                messageBlock.innerText = `${msg.role}: ${msg.content}`;
                messagesDiv.appendChild(messageBlock);
                messagesDiv.appendChild(document.createElement("br"));
            });
        }

        async function deleteAllConversations() {
            const confirmed = confirm(
                "Delete all conversations and messages? This cannot be undone."
            );

            if (!confirmed) {
                return;
            }

            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "Deleting conversations...";

            const response = await fetch("/conversations", {
                method: "DELETE"
            });

            const data = await response.json();

            if (!response.ok || data.success === false) {
                responseDiv.innerText = data.message || "Failed to delete conversations.";
                return;
            }

            currentConversationId = null;

            document.getElementById("current-chat").innerText = "No chat selected";
            document.getElementById("messages").innerHTML = "";
            document.getElementById("message").value = "";
            responseDiv.innerText = data.message || "All conversations deleted.";

            await loadConversations();
        }

    </script>
</body>
</html>
